<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목사고을 우리 나주 · 연필 스케치 4안</title>
  <style>
    :root { color-scheme: light; --ink: #172e2a; --muted: #52635e; --teal: #145f51; --line: #cad4d0; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fcfdfc; font: 1rem/1.5 system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
    main { width: min(calc(100% - 2rem), 68rem); margin: 0 auto; }
    header { padding: clamp(1.5rem, 4vw, 2.75rem) 0 1.2rem; border-bottom: 2px solid var(--ink); }
    h1, h2, figure { margin: 0; }
    h1 { font-size: clamp(1.5rem, 3.5vw, 2.6rem); line-height: 1.25; letter-spacing: -.05em; }
    p { margin: .55rem 0 0; }
    a { color: var(--teal); text-underline-offset: .22em; }
    a:focus-visible { outline: 3px solid #a7540e; outline-offset: 3px; }
    section { padding: 1.3rem 0 2rem; scroll-margin-top: 1rem; }
    section + section { border-top: 1px solid var(--line); }
    h2 { font-size: clamp(1.15rem, 2.5vw, 1.65rem); letter-spacing: -.035em; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.6rem, 2.25vw, 1.6rem); align-items: start; margin-top: .75rem; }
    figure { min-width: 0; }
    .art { display: block; background: white; outline: 1px solid var(--line); cursor: zoom-in; }
    .art img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: .55rem; font-size: clamp(.86rem, 1.6vw, 1rem); color: var(--muted); }
    figcaption strong { margin-right: .35em; color: var(--ink); }
    @media (max-width: 21rem) { main { width: calc(100% - 1.25rem); } }
    @media print { header p { display: none; } section { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>목사고을 우리 나주 · 연필 스케치 4안</h1>
      <p>실제 장소의 배치와 비례를 단순화해 앞표지 구도를 비교했습니다.</p>
      <p><strong><a href="color-studies.html">채색 시안 2점</a></strong> · <a href="index.html?menu=4">표지 목록으로</a> · <a href="gallery/pencil-studies/four-studies.jpg">네 장 한눈에 보기</a></p>
    </header>
    <section id="cover-21" aria-labelledby="heading-21">
      <h2 id="heading-21">21번 · 나주읍성 골목</h2>
      <div class="pair">
        <figure>
          <a class="art" href="gallery/pencil-studies/21-a.jpg" aria-label="21A 골목을 따라 정수루로 크게 보기">
            <img src="gallery/pencil-studies/21-a.jpg" alt="골목을 따라 정수루로 향하는 앞표지 연필 스케치" decoding="async">
          </a>
          <figcaption><strong>21A</strong>골목을 따라 정수루로</figcaption>
        </figure>
        <figure>
          <a class="art" href="gallery/pencil-studies/21-b.jpg" aria-label="21B 팽나무 아래에서 길 찾기 크게 보기">
            <img src="gallery/pencil-studies/21-b.jpg" alt="팽나무 아래에서 길을 찾는 앞표지 연필 스케치" decoding="async">
          </a>
          <figcaption><strong>21B</strong>팽나무 아래에서 길 찾기</figcaption>
        </figure>
      </div>
    </section>
    <section id="cover-81" aria-labelledby="heading-81">
      <h2 id="heading-81">81번 · 영산포 선창</h2>
      <div class="pair">
        <figure>
          <a class="art" href="gallery/pencil-studies/81-a.jpg" aria-label="81A 선창에서 바라본 황포돛배 크게 보기">
            <img src="gallery/pencil-studies/81-a.jpg" alt="선창에서 바라본 황포돛배 앞표지 연필 스케치" decoding="async" loading="lazy">
          </a>
          <figcaption><strong>81A</strong>선창에서 바라본 황포돛배</figcaption>
        </figure>
        <figure>
          <a class="art" href="gallery/pencil-studies/81-b.jpg" aria-label="81B 강가의 하얀 탑 크게 보기">
            <img src="gallery/pencil-studies/81-b.jpg" alt="강가에 서 있는 하얀 탑 앞표지 연필 스케치" decoding="async" loading="lazy">
          </a>
          <figcaption><strong>81B</strong>강가의 하얀 탑</figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
