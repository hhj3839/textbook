<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>선정 표지 5안 · 목사고을 우리 나주</title>
  <style>
    :root { color-scheme:light; color:#173b31; background:#fcfdfb; font:1rem/1.5 system-ui,"Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:78rem; margin:auto; padding:clamp(1rem,3vw,3rem); }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.7rem); line-height:1.25; letter-spacing:-.045em; }
    h2 { font-size:clamp(1.1rem,2vw,1.4rem); margin:0 0 .4rem; }
    h2 span { font-variant-numeric:tabular-nums; color:#12644f; margin-right:.45em; }
    header { border-bottom:2px solid #173b31; padding-bottom:1rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:.85rem; }
    a { color:#12644f; text-underline-offset:.22em; }
    a:focus-visible { outline:3px solid #a85602; outline-offset:3px; }
    .cards { display:grid; grid-template-columns:minmax(0,1fr); gap:1.65rem clamp(1rem,2vw,2rem); margin-top:1.5rem; }
    figure { margin:0; }
    figure a { display:block; background:white; box-shadow:0 0 0 1px #c5d5cc; cursor:zoom-in; }
    img { width:100%; height:auto; display:block; }
    figcaption { color:#42584d; margin-top:.35rem; font-size:.94rem; }
    @media(min-width:54rem) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>선정 펼친표지 5안</h1>
      <nav aria-label="선정 표지 자료">
        <a href="index.html?menu=4">표지 목록</a>
        <a href="index.html?menu=4&amp;view=front">앞표지만 보기</a>
        <a href="index.html?menu=4&amp;view=back">뒷표지만 보기</a>
        <a href="gallery/selected-five/five-spreads.pdf">다섯 안 PDF</a>
        <a href="gallery/selected-five/five-spreads.jpg">펼친표지 모음</a>
        <a href="gallery/selected-five/five-fronts.jpg">앞표지 모음</a>
      </nav>
    </header>
    <div class="cards">
      <section id="cover-06">
        <h2><span>06</span>금성관 담장 너머 배꽃</h2>
        <figure>
          <a href="gallery/selected-five/cover-06.jpg" aria-label="06번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-06.jpg" alt="목사고을 우리 나주 — 금성관의 지붕과 담장이 앞표지의 흰 배꽃으로 이어지는 봄 풍경" width="1554" height="999" decoding="async"></a>
          <figcaption>뒷표지 금성관 마당에 작은 인물을 두고, 담장을 따라 앞표지에는 배꽃 한 가지를 담았습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-21">
        <h2><span>21</span>남고문에서 향교까지</h2>
        <figure>
          <a href="gallery/selected-five/cover-21.jpg" aria-label="21번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-21.jpg" alt="목사고을 우리 나주 — 남고문과 향교 마루를 성안 길로 잇는 옛 나주 그림지도" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>남고문에서 시작한 길이 접힘선을 건너 향교로 이어집니다. 길 위에는 작은 학동 한 명이 보입니다.</figcaption>
        </figure>
      </section>
      <section id="cover-30">
        <h2><span>30</span>영산강 물길을 따라서</h2>
        <figure>
          <a href="gallery/selected-five/cover-30.jpg" aria-label="30번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-30.jpg" alt="목사고을 우리 나주 — 영산강의 황포돛배와 강 건너 영산포 자기수위표" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>황포돛배와 작은 나루는 뒷표지에, 강물의 높이를 재던 영산포 자기수위표와 갈대는 앞표지에 놓았습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-81">
        <h2><span>81</span>나주배꽃이 피는 봄</h2>
        <figure>
          <a href="gallery/selected-five/cover-81.jpg" aria-label="81번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-81.jpg" alt="목사고을 우리 나주 — 과수원에서 뻗은 배나무 가지 끝에 커다란 흰 꽃이 핀 표지" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지의 작은 농부와 오래된 배나무에서 시선이 출발해, 앞표지의 흰 꽃송이에 닿습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-82">
        <h2><span>82</span>쪽빛 천에 핀 배꽃</h2>
        <figure>
          <a href="gallery/selected-five/cover-82.jpg" aria-label="82번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-82.jpg" alt="목사고을 우리 나주 — 쪽빛 천을 펴는 장인과 어린이, 천 위에 번진 흰 배꽃 무늬" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지에서 펼친 쪽빛 천이 앞표지의 흰 배꽃 무늬로 이어집니다.</figcaption>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
