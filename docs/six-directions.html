<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>선정 표지 5안 · 목사고을 우리 나주</title>
  <style>
    :root { color-scheme:light; color:#173b31; background:#fcfdfb; font:1rem/1.5 system-ui,"Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:78rem; margin:auto; padding:clamp(1rem,3vw,3rem); }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.7rem); line-height:1.25; letter-spacing:-.045em; }
    h2 { font-size:clamp(1.1rem,2vw,1.4rem); margin:0 0 .4rem; }
    h2 span { font-variant-numeric:tabular-nums; color:#12644f; margin-right:.45em; }
    header { border-bottom:2px solid #173b31; padding-bottom:1rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:.85rem; }
    a { color:#12644f; text-underline-offset:.22em; }
    a:focus-visible { outline:3px solid #a85602; outline-offset:3px; }
    .cards { display:grid; grid-template-columns:minmax(0,1fr); gap:1.65rem clamp(1rem,2vw,2rem); margin-top:1.5rem; }
    figure { margin:0; }
    figure a { display:block; background:white; box-shadow:0 0 0 1px #c5d5cc; cursor:zoom-in; }
    img { width:100%; height:auto; display:block; }
    figcaption { color:#42584d; margin-top:.35rem; font-size:.94rem; }
    @media(min-width:54rem) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>선정 펼친표지 5안</h1>
      <nav aria-label="선정 표지 자료">
        <a href="index.html?menu=4">표지 목록</a>
        <a href="index.html?menu=4&amp;view=front">앞표지만 보기</a>
        <a href="index.html?menu=4&amp;view=back">뒷표지만 보기</a>
        <a href="gallery/selected-five/five-spreads.pdf">다섯 안 PDF</a>
        <a href="gallery/selected-five/five-spreads.jpg">펼친표지 모음</a>
        <a href="gallery/selected-five/five-fronts.jpg">앞표지 모음</a>
      </nav>
    </header>
    <div class="cards">
      <section id="cover-06">
        <h2><span>06</span>가을 들녘에서 보는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-06.jpg" aria-label="06번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-06.jpg" alt="목사고을 우리 나주 — 가을걷이하는 농부와 영산포의 돛배·등대, 들녘 너머 금성관과 빛가람호수·전망대" width="1554" height="999" decoding="async"></a>
          <figcaption>논둑길은 볏단 수레와 벼 이삭을 잇습니다. 강가에는 황포돛배와 영산포등대를, 금성관 너머에는 빛가람호수와 전망대를 그린 나주 풍경화입니다.</figcaption>
        </figure>
      </section>
      <section id="cover-21">
        <h2><span>21</span>골목길을 따라 만나는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-21.jpg" aria-label="21번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-21.jpg" alt="목사고을 우리 나주 — 읍성과 금성관, 영산강의 황포돛배·영산포등대, 빛가람호수와 전망대가 담긴 그림지도" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>읍성에서 출발해 금성관과 영산포를 지나 빛가람호수에 이르는 그림지도입니다. 영산포등대는 강가에, 전망대는 호숫가 언덕에 자리합니다.</figcaption>
        </figure>
      </section>
      <section id="cover-30">
        <h2><span>30</span>처마 아래에서 본 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-30.jpg" aria-label="30번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-30.jpg" alt="목사고을 우리 나주 — 금성관 쪽 영산강에 황포돛배와 영산포등대가 있고, 버드나무 건너편에 빛가람호수와 전망대가 펼쳐진 그림" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>처마 아래 금성관과 영산강 포구를 뒷표지에, 빛가람호수와 전망대를 앞표지에 담았습니다. 가운데 버드나무에서 두 장소가 전환됩니다.</figcaption>
        </figure>
      </section>
      <section id="cover-81">
        <h2><span>81</span>영산강을 따라 읽는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-81.jpg" aria-label="81번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-81.jpg" alt="목사고을 우리 나주 — 영산강의 돛배와 나루 일꾼, 강둑의 영산포등대 및 금성관·빛가람호수·전망대 그림지도" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뱃사공과 나루 일꾼 사이로 밧줄이 건너갑니다. 영산포등대는 강둑에, 금성관·빛가람호수·전망대는 뒷표지 위 작은 그림지도에 담았습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-82">
        <h2><span>82</span>금성관 마당에서 시작하는 답사</h2>
        <figure>
          <a href="gallery/selected-five/cover-82.jpg" aria-label="82번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-82.jpg" alt="목사고을 우리 나주 — 지도책의 영산강·황포돛배·영산포등대, 빛가람호수와 전망대, 마당 너머 금성관" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>지도책에는 영산강의 돛배와 등대, 빛가람호수와 전망대가 담겨 있습니다. 학생이 짚은 금성관을 마당 건너에서 다시 만납니다.</figcaption>
        </figure>
      </section>
    </div>
