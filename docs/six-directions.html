<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>선정 표지 5안 · 목사고을 우리 나주</title>
  <style>
    :root { color-scheme:light; color:#173b31; background:#fcfdfb; font:1rem/1.5 system-ui,"Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:78rem; margin:auto; padding:clamp(1rem,3vw,3rem); }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.7rem); line-height:1.25; letter-spacing:-.045em; }
    h2 { font-size:clamp(1.1rem,2vw,1.4rem); margin:0 0 .4rem; }
    h2 span { font-variant-numeric:tabular-nums; color:#12644f; margin-right:.45em; }
    header { border-bottom:2px solid #173b31; padding-bottom:1rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:.85rem; }
    a { color:#12644f; text-underline-offset:.22em; }
    a:focus-visible { outline:3px solid #a85602; outline-offset:3px; }
    .cards { display:grid; grid-template-columns:minmax(0,1fr); gap:1.65rem clamp(1rem,2vw,2rem); margin-top:1.5rem; }
    figure { margin:0; }
    figure a { display:block; background:white; box-shadow:0 0 0 1px #c5d5cc; cursor:zoom-in; }
    img { width:100%; height:auto; display:block; }
    figcaption { color:#42584d; margin-top:.35rem; font-size:.94rem; }
    @media(min-width:54rem) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>선정 펼친표지 5안</h1>
      <nav aria-label="선정 표지 자료">
        <a href="index.html?menu=4">표지 목록</a>
        <a href="index.html?menu=4&amp;view=front">앞표지만 보기</a>
        <a href="index.html?menu=4&amp;view=back">뒷표지만 보기</a>
        <a href="gallery/selected-five/five-spreads.pdf">다섯 안 PDF</a>
        <a href="gallery/selected-five/five-spreads.jpg">펼친표지 모음</a>
        <a href="gallery/selected-five/five-fronts.jpg">앞표지 모음</a>
      </nav>
    </header>
    <div class="cards">
      <section id="cover-06">
        <h2><span>06</span>나주목사의 고을살이</h2>
        <figure>
          <a href="gallery/selected-five/cover-06.jpg" aria-label="06번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-06.jpg" alt="동헌 마당에서 소지를 내미는 주민과 마루에서 귀 기울이는 나주목사" width="1554" height="999" decoding="async"></a>
          <figcaption>주민이 두 손으로 소지(청원 문서)를 내밀고, 나주목사가 마루에서 사정을 듣습니다. 동헌에서의 만남을 상상해 그렸습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-21">
        <h2><span>21</span>읍성 안, 향교로 가는 길</h2>
        <figure>
          <a href="gallery/selected-five/cover-21.jpg" aria-label="21번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-21.jpg" alt="책보를 멘 학동이 흙담길을 따라 나주향교의 명륜당으로 향하는 모습" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>책보를 멘 학동이 흙담길을 돌아서자, 명륜당 마루에서 책을 펴고 기다리는 스승이 보입니다.</figcaption>
        </figure>
      </section>
      <section id="cover-30">
        <h2><span>30</span>영산포 나루에 닿은 짐</h2>
        <figure>
          <a href="gallery/selected-five/cover-30.jpg" aria-label="30번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-30.jpg" alt="영산강 황포돛배의 뱃사공과 영산포 나루 일꾼이 짚으로 싼 짐을 건네는 모습" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>배가 나루에 닿자 뱃사공이 짚으로 싼 짐 하나를 내밉니다. 뭍의 일꾼이 두 손으로 받습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-81">
        <h2><span>81</span>배꽃 핀 나주 과수원</h2>
        <figure>
          <a href="gallery/selected-five/cover-81.jpg" aria-label="81번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-81.jpg" alt="하얀 배꽃이 핀 가지 끝에서 농부가 작은 붓으로 꽃가루를 묻히는 모습" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>배나무에서 뻗은 가지 끝에 흰 꽃이 피었습니다. 농부가 붓으로 꽃가루를 묻힙니다.</figcaption>
        </figure>
      </section>
      <section id="cover-82">
        <h2><span>82</span>쪽빛을 배우는 어린이</h2>
        <figure>
          <a href="gallery/selected-five/cover-82.jpg" aria-label="82번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-82.jpg" alt="쪽염색 공방에서 장인과 어린이가 쪽빛 천의 양 끝을 잡고 펼쳐 보는 모습" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>장인이 천의 한쪽을 펴자 어린이가 맞은편 끝을 잡습니다. 두 사람의 손 사이로 나주의 쪽빛이 드러납니다.</figcaption>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
