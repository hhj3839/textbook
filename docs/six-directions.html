<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>선정 표지 5안 · 목사고을 우리 나주</title>
  <style>
    :root { color-scheme:light; color:#173b31; background:#fcfdfb; font:1rem/1.5 system-ui,"Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:78rem; margin:auto; padding:clamp(1rem,3vw,3rem); }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.7rem); line-height:1.25; letter-spacing:-.045em; }
    h2 { font-size:clamp(1.1rem,2vw,1.4rem); margin:0 0 .4rem; }
    h2 span { font-variant-numeric:tabular-nums; color:#12644f; margin-right:.45em; }
    header { border-bottom:2px solid #173b31; padding-bottom:1rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:.85rem; }
    a { color:#12644f; text-underline-offset:.22em; }
    a:focus-visible { outline:3px solid #a85602; outline-offset:3px; }
    .cards { display:grid; grid-template-columns:minmax(0,1fr); gap:1.65rem clamp(1rem,2vw,2rem); margin-top:1.5rem; }
    figure { margin:0; }
    figure a { display:block; background:white; box-shadow:0 0 0 1px #c5d5cc; cursor:zoom-in; }
    img { width:100%; height:auto; display:block; }
    figcaption { color:#42584d; margin-top:.35rem; font-size:.94rem; }
    @media(min-width:54rem) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>선정 펼친표지 5안</h1>
      <nav aria-label="선정 표지 자료">
        <a href="index.html?menu=4">표지 목록</a>
        <a href="index.html?menu=4&amp;view=front">앞표지만 보기</a>
        <a href="index.html?menu=4&amp;view=back">뒷표지만 보기</a>
        <a href="gallery/selected-five/five-spreads.pdf">다섯 안 PDF</a>
        <a href="gallery/selected-five/five-spreads.jpg">펼친표지 모음</a>
        <a href="gallery/selected-five/five-fronts.jpg">앞표지 모음</a>
      </nav>
    </header>
    <div class="cards">
      <section id="cover-06">
        <h2><span>06</span>가을 들녘에서 보는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-06.jpg" aria-label="06번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-06.jpg" alt="수레에서 볏단을 주고받는 농부들과 논둑길 건너 벼를 베는 콤바인" width="1554" height="999" decoding="async"></a>
          <figcaption>뒷표지의 농부들이 건네는 볏단에서 앞표지의 콤바인까지, 논둑길을 따라 가을걷이가 이어집니다.</figcaption>
        </figure>
      </section>
      <section id="cover-21">
        <h2><span>21</span>골목길을 따라 만나는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-21.jpg" aria-label="21번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-21.jpg" alt="남고문으로 들어서는 학생들과 읍성 골목 너머 금성관 앞마당을 담은 그림지도" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지의 남고문을 지나 골목을 따라가면 앞표지의 금성관에 닿습니다. 읍성 답사 장면을 재구성한 그림지도입니다.</figcaption>
        </figure>
      </section>
      <section id="cover-30">
        <h2><span>30</span>처마 아래에서 본 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-30.jpg" aria-label="30번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-30.jpg" alt="처마와 버드나무 아래 호숫길이 빛가람전망대와 산책하는 가족에게 이어지는 풍경" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지에는 금성관에서 따온 처마를, 앞표지에는 빛가람 호숫길을 걷는 가족을 담았습니다. 서로 다른 두 장소를 한 풍경으로 엮었습니다.</figcaption>
        </figure>
      </section>
      <section id="cover-81">
        <h2><span>81</span>영산강을 따라 읽는 나주</h2>
        <figure>
          <a href="gallery/selected-five/cover-81.jpg" aria-label="81번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-81.jpg" alt="황포돛배의 뱃사공이 나루터 돌계단의 일꾼에게 밧줄을 던지는 모습" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지의 뱃사공이 밧줄을 던지면 앞표지의 나루 일꾼이 두 손을 내밉니다.</figcaption>
        </figure>
      </section>
      <section id="cover-82">
        <h2><span>82</span>금성관 마당에서 시작하는 답사</h2>
        <figure>
          <a href="gallery/selected-five/cover-82.jpg" aria-label="82번 펼친표지 크게 보기"><img src="gallery/selected-five/cover-82.jpg" alt="뒷표지 학생이 짚은 지도책의 금성관과 마당의 돌길 너머 앞표지의 금성관" width="1554" height="999" decoding="async" loading="lazy"></a>
          <figcaption>뒷표지에서 학생이 손끝으로 짚은 지도책 속 금성관이 앞표지에서는 마당 건너 눈앞에 펼쳐집니다.</figcaption>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
