<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목사고을 우리 나주 · 여섯 방향 앞표지</title>
  <style>
    :root { color-scheme: light; --ink: #18352e; --link: #165e50; --line: #c8d6cf; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfdfb; color: var(--ink); font: 1rem/1.5 system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
    main { max-width: 75rem; margin: auto; padding: 0 clamp(1rem, 3vw, 3rem) 2rem; }
    header { padding: clamp(1.5rem, 4vw, 3.5rem) 0 1.25rem; border-bottom: 2px solid var(--ink); }
    h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.75rem); line-height: 1.25; letter-spacing: -.055em; }
    p { margin: .65rem 0 0; color: #465c53; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; margin-top: .8rem; }
    a { color: var(--link); text-underline-offset: .22em; }
    nav a { padding-block: .22rem; }
    a:focus-visible { outline: 3px solid #a7540e; outline-offset: 3px; }
    .covers { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(1.3rem, 2vw, 2rem) clamp(.75rem, 1.5vw, 1.4rem); padding: 0; margin: 1.5rem 0 0; list-style: none; }
    .covers li { min-width: 0; scroll-margin: 1rem; }
    figure { margin: 0; }
    .art { display: block; background: white; box-shadow: 0 0 0 1px var(--line); cursor: zoom-in; }
    .art:hover { box-shadow: 0 0 0 2px var(--link); }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 1284; object-fit: contain; }
    figcaption { display: flex; gap: .45em; align-items: baseline; margin-top: .65rem; line-height: 1.4; font-size: clamp(.88rem, 1.25vw, 1.1rem); font-weight: 650; letter-spacing: -.035em; }
    figcaption span { color: var(--link); font-size: .86em; font-variant-numeric: tabular-nums; }
    @media (min-width: 34rem) { .covers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 56rem) { .covers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>목사고을 우리 나주 · 여섯 방향 앞표지</h1>
      <p>앞표지마다 영산강, 황포돛배, 영산포등대, 금성관, 빛가람호수공원 전망대를 담았습니다. 표지를 누르면 크게 볼 수 있습니다.</p>
      <nav aria-label="표지 비교 자료">
        <a href="gallery/common-five/six-covers.jpg">여섯 표지 한 장으로 보기</a>
        <a href="gallery/six-directions/six-covers.jpg">이전 앞표지 여섯 안</a>
        <a href="cover-comparison.html">기존 펼친표지 비교</a>
        <a href="index.html?menu=4">표지 목록</a>
      </nav>
    </header>
    <ul class="covers" aria-label="다섯 공통 소재를 담은 앞표지 시안">
      <li id="cover-06">
        <figure>
          <a class="art" href="gallery/common-five/06.jpg" aria-label="06 가을 들녘에서 보는 나주 크게 보기"><img src="gallery/common-five/06.jpg" width="1000" height="1284" alt="익은 벼와 나주평야를 앞에 둔 가을걷이 장면"></a>
          <figcaption><span>06</span> 가을 들녘에서 보는 나주</figcaption>
        </figure>
      </li>
      <li id="cover-21">
        <figure>
          <a class="art" href="gallery/common-five/21.jpg" aria-label="21 골목길을 따라 만나는 나주 크게 보기"><img src="gallery/common-five/21.jpg" width="1000" height="1284" alt="옛 도심의 정수루와 골목을 따라가는 입체 그림지도"></a>
          <figcaption><span>21</span> 골목길을 따라 만나는 나주</figcaption>
        </figure>
      </li>
      <li id="cover-30">
        <figure>
          <a class="art" href="gallery/common-five/30.jpg" aria-label="30 옛 처마와 오늘의 빛가람 크게 보기"><img src="gallery/common-five/30.jpg" width="1000" height="1284" alt="답사 수첩에 나란히 담은 옛 도심과 빛가람호수공원"></a>
          <figcaption><span>30</span> 옛 처마와 오늘의 빛가람</figcaption>
        </figure>
      </li>
      <li id="cover-77">
        <figure>
          <a class="art" href="gallery/common-five/77.jpg" aria-label="77 쪽빛 천에 펼쳐지는 나주 크게 보기"><img src="gallery/common-five/77.jpg" width="1000" height="1284" alt="쪽빛 천의 무늬로 드러나는 나주의 강과 건물"></a>
          <figcaption><span>77</span> 쪽빛 천에 펼쳐지는 나주</figcaption>
        </figure>
      </li>
      <li id="cover-81">
        <figure>
          <a class="art" href="gallery/common-five/81.jpg" aria-label="81 영산강을 따라 읽는 나주 크게 보기"><img src="gallery/common-five/81.jpg" width="1000" height="1284" alt="영산포등대와 황포돛배에서 시작하는 강가 답사"></a>
          <figcaption><span>81</span> 영산강을 따라 읽는 나주</figcaption>
        </figure>
      </li>
      <li id="cover-82">
        <figure>
          <a class="art" href="gallery/common-five/82.jpg" aria-label="82 금성관 마당에서 시작하는 답사 크게 보기"><img src="gallery/common-five/82.jpg" width="1000" height="1284" alt="금성관 마당과 아이가 펼쳐 보는 나주 답사도"></a>
          <figcaption><span>82</span> 금성관 마당에서 시작하는 답사</figcaption>
        </figure>
      </li>
    </ul>
  </main>
</body>
</html>
