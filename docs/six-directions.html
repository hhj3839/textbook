<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목사고을 우리 나주 · 여섯 방향 앞표지</title>
  <style>
    :root { color-scheme: light; --ink: #18352e; --link: #165e50; --line: #c8d6cf; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfdfb; color: var(--ink); font: 1rem/1.5 system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
    main { max-width: 94rem; margin: auto; padding: 0 clamp(1rem, 3vw, 3rem) 2rem; }
    header { padding: clamp(1.5rem, 4vw, 3.5rem) 0 1.25rem; border-bottom: 2px solid var(--ink); }
    h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.75rem); line-height: 1.25; letter-spacing: -.055em; }
    p { margin: .65rem 0 0; color: #465c53; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; margin-top: .8rem; }
    a { color: var(--link); text-underline-offset: .22em; }
    nav a { padding-block: .22rem; }
    a:focus-visible { outline: 3px solid #a7540e; outline-offset: 3px; }
    .covers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(1.3rem, 2vw, 2rem) clamp(.75rem, 1.5vw, 1.4rem); padding: 0; margin: 1.5rem 0 0; list-style: none; }
    .covers li { min-width: 0; scroll-margin: 1rem; }
    figure { margin: 0; }
    .art { display: block; background: white; box-shadow: 0 0 0 1px var(--line); cursor: zoom-in; }
    .art:hover { box-shadow: 0 0 0 2px var(--link); }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 1284; object-fit: contain; }
    figcaption { display: flex; gap: .45em; align-items: baseline; margin-top: .65rem; line-height: 1.4; font-size: clamp(.88rem, 1.25vw, 1.1rem); font-weight: 650; letter-spacing: -.035em; }
    figcaption span { color: var(--link); font-size: .86em; font-variant-numeric: tabular-nums; }
    @media (min-width: 40rem) { .covers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 72rem) { .covers { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>목사고을 우리 나주 · 여섯 방향 앞표지</h1>
      <p>실제 장소의 배치와 비례를 단순화한 앞표지 시안입니다.</p>
      <nav aria-label="표지 보기">
        <a href="gallery/six-directions/six-covers.jpg">여섯 표지 한 장으로 보기</a>
        <a href="index.html?menu=4">펼친표지 목록</a>
      </nav>
    </header>
    <ul class="covers" aria-label="앞표지 채색 시안">
      <li id="cover-06">
        <figure>
          <a class="art" href="gallery/six-directions/06.jpg" aria-label="06 나주평야의 가을걷이 크게 보기"><img src="gallery/six-directions/06.jpg" width="1000" height="1284" alt="나주평야의 가을걷이 앞표지"></a>
          <figcaption><span>06</span> 나주평야의 가을걷이</figcaption>
        </figure>
      </li>
      <li id="cover-21">
        <figure>
          <a class="art" href="gallery/color-studies/21-a.jpg" aria-label="21 골목을 따라 정수루로 크게 보기"><img src="gallery/color-studies/21-a.jpg" width="1000" height="1284" alt="골목을 따라 정수루로 앞표지"></a>
          <figcaption><span>21</span> 골목을 따라 정수루로</figcaption>
        </figure>
      </li>
      <li id="cover-30">
        <figure>
          <a class="art" href="gallery/six-directions/30.jpg" aria-label="30 빛가람에서 내가 아는 곳 찾기 크게 보기"><img src="gallery/six-directions/30.jpg" width="1000" height="1284" alt="빛가람에서 내가 아는 곳 찾기 앞표지"></a>
          <figcaption><span>30</span> 빛가람에서 내가 아는 곳 찾기</figcaption>
        </figure>
      </li>
      <li id="cover-77">
        <figure>
          <a class="art" href="gallery/six-directions/77.jpg" aria-label="77 쪽빛 무늬가 드러나는 순간 크게 보기"><img src="gallery/six-directions/77.jpg" width="1000" height="1284" alt="쪽빛 무늬가 드러나는 순간 앞표지"></a>
          <figcaption><span>77</span> 쪽빛 무늬가 드러나는 순간</figcaption>
        </figure>
      </li>
      <li id="cover-81">
        <figure>
          <a class="art" href="gallery/color-studies/81-b.jpg" aria-label="81 영산포 강가의 하얀 탑 크게 보기"><img src="gallery/color-studies/81-b.jpg" width="1000" height="1284" alt="영산포 강가의 하얀 탑 앞표지"></a>
          <figcaption><span>81</span> 영산포 강가의 하얀 탑</figcaption>
        </figure>
      </li>
      <li id="cover-82">
        <figure>
          <a class="art" href="gallery/six-directions/82.jpg" aria-label="82 금성관 마당에 들어서며 크게 보기"><img src="gallery/six-directions/82.jpg" width="1000" height="1284" alt="금성관 마당에 들어서며 앞표지"></a>
          <figcaption><span>82</span> 금성관 마당에 들어서며</figcaption>
        </figure>
      </li>
    </ul>
  </main>
</body>
</html>
