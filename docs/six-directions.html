  <style>
    :root { color-scheme: light; --ink: #18352e; --link: #165e50; --line: #c8d6cf; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fcfdfb; color: var(--ink); font: 1rem/1.5 system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: break-word; }
    main { max-width: 86rem; margin: auto; padding: 0 clamp(1rem, 3vw, 3rem) 3rem; }

    h2 { margin: 0 0 .65rem; font-size: clamp(1.16rem, 2.1vw, 1.52rem); }
    h2 span { color: var(--link); font-variant-numeric: tabular-nums; margin-right: .4em; }
    p { margin: .65rem 0 0; color: #465c53; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1.2rem; margin-top: .8rem; }
    a { color: var(--link); text-underline-offset: .22em; }
    nav a { padding-block: .25rem; }
    details { margin-top: .75rem; }
    summary { cursor: pointer; color: var(--link); width: fit-content; }
    :focus-visible { outline: 3px solid #a7540e; outline-offset: 3px; }
    .versions { gap: .35rem; }
    .versions span { margin-right: .5rem; font-weight: 650; }
    .versions a { padding: .38rem .68rem; border: 1px solid var(--line); border-radius: .3rem; text-decoration: none; }
    .versions a[aria-current] { background: var(--link); border-color: var(--link); color: white; }
    .pair { margin-top: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); scroll-margin-top: 1rem; }
    .pictures { display: grid; grid-template-columns: minmax(0, 1fr); gap: .95rem clamp(1.1rem, 2vw, 2rem); }
    figure { margin: 0; min-width: 0; }
    figcaption { display: flex; align-items: baseline; flex-wrap: wrap; gap: .2em .65em; margin-bottom: .35rem; }
    figcaption b { color: var(--link); }
    .art { display: block; background: white; box-shadow: 0 0 0 1px var(--line); cursor: zoom-in; }
    .art:hover { box-shadow: 0 0 0 2px var(--link); }
    img { display: block; width: 100%; height: auto; }
    @media (min-width: 44rem) { .pictures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>

  </main>
  <script>
    const versions = {
      original: { label: '최초 원화', directory: 'clear-edition/originals', width: 1565, height: 1005 },
      paired: { label: '직전 두 장면 시안', directory: 'common-five-spreads', width: 2000, height: 1284 }
    };
    const choice = new URLSearchParams(location.search).get('base');
    if (Object.hasOwn(versions, choice)) {
      const edition = versions[choice];
      for (const tab of document.querySelectorAll('[data-base]')) {
        if (tab.dataset.base === choice) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      }
      for (const pair of document.querySelectorAll('.pair')) {
        const number = pair.dataset.id;
        const figure = pair.querySelector('.base');
        const title = choice === 'original' ? pair.dataset.original : pair.querySelector('.latest figcaption span').textContent;
        const link = figure.querySelector('a');
        const image = link.querySelector('img');
        const path = 'gallery/' + edition.directory + '/cover-' + number + '.jpg';
        figure.querySelector('figcaption b').textContent = edition.label;
        figure.querySelector('figcaption span').textContent = title;
        link.href = path;
        link.setAttribute('aria-label', number + '번 ' + edition.label + ' 크게 보기');
        image.width = edition.width;
        image.height = edition.height;
        image.alt = number + '번 ' + edition.label + ' · ' + title;
        image.src = path;
      }
    }
  </script>
