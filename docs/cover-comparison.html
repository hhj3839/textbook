<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목사고을 우리 나주 · 수정 전후 비교</title>
  <style>
    :root { color-scheme: light; --ink: #172e2a; --muted: #52635e; --teal: #145f51; --line: #cad4d0; --paper: #fcfdfc; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 system-ui, "Malgun Gothic", sans-serif; overflow-wrap: break-word; word-break: keep-all; }
    .review { width: min(100% - 3rem, 94rem); margin-inline: auto; }
    header { padding: 2.5rem 0 1.4rem; border-bottom: 2px solid var(--ink); }
    h1, h2, p, figure { margin: 0; }
    h1 { font-size: clamp(1.55rem, 3.1vw, 2.65rem); line-height: 1.25; letter-spacing: -.05em; }
    header p { margin-top: .45rem; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: .85rem 2rem; align-items: center; justify-content: space-between; margin: 1.1rem 0; }
    fieldset, nav { margin: 0; padding: 0; border: 0; }
    .options, nav { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .options label, nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.65rem; padding: .38rem .85rem; text-decoration: none; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: .4rem; font-size: .95rem; font-weight: 650; cursor: pointer; }
    .options input:checked + label { color: white; background: var(--teal); border-color: var(--teal); }
    a:focus-visible, .options input:focus-visible + label { outline: 3px solid #a7540e; outline-offset: 3px; }
    nav a { min-width: 2.65rem; padding-inline: .5rem; }
    nav a:hover, .options input:not(:checked) + label:hover { background: #e9f2ef; }
    nav span { color: var(--muted); font-size: .94rem; margin-right: .2rem; }
    .candidate { padding: 1.4rem 0 2.25rem; border-top: 1px solid var(--line); scroll-margin-top: 1rem; }
    h2 { display: flex; gap: .65rem; align-items: baseline; font-size: clamp(1.12rem, 2.1vw, 1.6rem); line-height: 1.4; letter-spacing: -.03em; }
    .number { color: var(--teal); font-size: .85em; font-variant-numeric: tabular-nums; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.65rem, 2vw, 1.75rem); align-items: start; margin-top: .7rem; }
    figure { min-width: 0; }
    figcaption { color: var(--muted); font-weight: 650; margin-bottom: .38rem; }
    .revised figcaption { color: var(--teal); }
    .art { display: block; width: 100%; overflow: hidden; border-radius: .22rem; background: white; outline: 1px solid var(--line); cursor: zoom-in; }
    .art img { display: block; width: 100%; max-width: none; height: auto; }
    .review:has(#front:checked) .art, .review:has(#back:checked) .art { max-width: 34rem; margin-inline: auto; }
    .review:has(#front:checked) .art img, .review:has(#back:checked) .art img { width: 200%; }
    .review:has(#front:checked) .art img { transform: translateX(-50%); }
    footer { padding: .3rem 0 2.5rem; }
    .gallery-link, footer a { color: var(--teal); text-underline-offset: .22em; }
    @media (max-width: 600px) {
      .review { width: calc(100% - 1.5rem); }
      header { padding-top: 1.55rem; }
      .controls { gap: .6rem; }
      .pair { gap: .65rem; }
      .review:has(#spread:checked) .pair { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    }
    @media print {
      .controls, footer { display: none; }
      .review { width: 100%; }
      .candidate { break-inside: avoid; padding-block: 1rem; }
      .art { outline: none; }
    }
  </style>
</head>
<body>
  <main class="review" id="top">
    <header>
      <h1>목사고을 우리 나주 · 수정 전후 비교</h1>
      <p><a class="gallery-link" href="index.html?menu=4">표지 목록으로</a></p>
    </header>
    <div class="controls">
      <fieldset>
        <legend class="sr">표지 보기</legend>
        <div class="options">
          <input class="sr" type="radio" id="spread" name="view" checked><label for="spread">펼친표지</label>
          <input class="sr" type="radio" id="front" name="view"><label for="front">앞표지</label>
          <input class="sr" type="radio" id="back" name="view"><label for="back">뒷표지</label>
        </div>
      </fieldset>
      <nav aria-label="시안 바로가기"><span>시안</span>
        <a href="#cover-06" aria-label="06번 시안으로 이동">06</a>
        <a href="#cover-21" aria-label="21번 시안으로 이동">21</a>
        <a href="#cover-30" aria-label="30번 시안으로 이동">30</a>
        <a href="#cover-77" aria-label="77번 시안으로 이동">77</a>
        <a href="#cover-81" aria-label="81번 시안으로 이동">81</a>
        <a href="#cover-82" aria-label="82번 시안으로 이동">82</a>
      </nav>
    </div>
    <section class="candidate" id="cover-06" aria-labelledby="heading-06">
      <h2 id="heading-06"><span class="number">06</span>황금빛 가을 논</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-06.jpg" aria-label="06번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-06.jpg" alt="06번 수정 전 표지 · 논마다 반복되는 무늬" decoding="async">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-06.jpg" aria-label="06번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-06.jpg" alt="06번 수정 후 표지 · 황금빛 가을 논" decoding="async">
          </a>
        </figure>
      </div>
    </section>
    <section class="candidate" id="cover-21" aria-labelledby="heading-21">
      <h2 id="heading-21"><span class="number">21</span>마을길과 작은 다리</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-21.jpg" aria-label="21번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-21.jpg" alt="21번 수정 전 표지 · 작은 입체 지도" decoding="async" loading="lazy">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-21.jpg" aria-label="21번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-21.jpg" alt="21번 수정 후 표지 · 마을길과 작은 다리" decoding="async" loading="lazy">
          </a>
        </figure>
      </div>
    </section>
    <section class="candidate" id="cover-30" aria-labelledby="heading-30">
      <h2 id="heading-30"><span class="number">30</span>처마 아래에서 본 나주</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-30.jpg" aria-label="30번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-30.jpg" alt="30번 수정 전 표지 · 꽃무늬가 반복되는 처마" decoding="async" loading="lazy">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-30.jpg" aria-label="30번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-30.jpg" alt="30번 수정 후 표지 · 처마 아래에서 본 나주" decoding="async" loading="lazy">
          </a>
        </figure>
      </div>
    </section>
    <section class="candidate" id="cover-77" aria-labelledby="heading-77">
      <h2 id="heading-77"><span class="number">77</span>쪽빛 천을 펼친 아이들</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-77.jpg" aria-label="77번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-77.jpg" alt="77번 수정 전 표지 · 쪽빛 천과 빛가람호수공원 전망대" decoding="async" loading="lazy">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-77.jpg" aria-label="77번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-77.jpg" alt="77번 수정 후 표지 · 쪽빛 천을 펼친 아이들" decoding="async" loading="lazy">
          </a>
        </figure>
      </div>
    </section>
    <section class="candidate" id="cover-81" aria-labelledby="heading-81">
      <h2 id="heading-81"><span class="number">81</span>영산강의 황포돛배</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-81.jpg" aria-label="81번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-81.jpg" alt="81번 수정 전 표지 · 황포돛배와 영산강" decoding="async" loading="lazy">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-81.jpg" aria-label="81번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-81.jpg" alt="81번 수정 후 표지 · 영산강의 황포돛배" decoding="async" loading="lazy">
          </a>
        </figure>
      </div>
    </section>
    <section class="candidate" id="cover-82" aria-labelledby="heading-82">
      <h2 id="heading-82"><span class="number">82</span>금성관 마당</h2>
      <div class="pair">
        <figure>
          <figcaption>수정 전</figcaption>
          <a class="art" href="gallery/clear-edition/originals/cover-82.jpg" aria-label="82번 수정 전 전체 이미지 열기">
            <img src="gallery/clear-edition/originals/cover-82.jpg" alt="82번 수정 전 표지 · 금성관 마당" decoding="async" loading="lazy">
          </a>
        </figure>
        <figure class="revised">
          <figcaption>수정 후</figcaption>
          <a class="art" href="gallery/clear-edition/cover-82.jpg" aria-label="82번 수정 후 전체 이미지 열기">
            <img src="gallery/clear-edition/cover-82.jpg" alt="82번 수정 후 표지 · 금성관 마당" decoding="async" loading="lazy">
          </a>
        </figure>
      </div>
    </section>
    <footer><a href="#top">맨 위로</a></footer>
  </main>
</body>
</html>
